<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modern Table has moved</title>
<link rel="canonical" href="https://modern-table.github.io/">
<noscript><meta http-equiv="refresh" content="0; url=https://modern-table.github.io/"></noscript>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#16251d;color:#e8e2cf;font:17px/1.5 Georgia,serif;text-align:center;padding:16px;box-sizing:border-box}
  a{color:#e2c46b}
  h1{font-weight:400;font-size:26px;margin:0 0 8px}
</style>
</head>
<body>
<main>
  <h1>Modern Table has moved</h1>
  <p>New address: <a id="go" href="https://modern-table.github.io/">modern-table.github.io</a></p>
  <p id="msg">Taking you there now. Please update your bookmark.</p>
</main>
<script>
(function(){
  var NEW = 'https://modern-table.github.io/', data = {}, any = false, hash = '';
  ['mt_decks','mt_settings','mt_dview'].forEach(function(k){
    try{ var v = localStorage.getItem(k); if(v){ data[k] = JSON.parse(v); any = true; } }catch(e){}
  });
  if(any){
    try{
      var bytes = new TextEncoder().encode(JSON.stringify(data)), bin = '';
      for(var i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
      var b64 = btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
      if(b64.length < 1500000) hash = '#import=' + b64;
    }catch(e){}
  }
  var target = NEW + location.search + hash;
  document.getElementById('go').href = target;
  if(hash) document.getElementById('msg').textContent = 'Taking you there now, with your saved decks. Please update your bookmark.';
  location.replace(target);
})();
</script>
</body>
</html>
